apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phaeton.fullname" . }}
  labels:
    {{- include "phaeton.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate ensures the old pod releases the SQLite file before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "phaeton.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "phaeton.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: phaeton
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "phaeton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PHX_SERVER
              value: "true"
            - name: PHX_HOST
              value: {{ .Values.env.phxHost | quote }}
            - name: PORT
              value: "4000"
            - name: POOL_SIZE
              value: {{ .Values.env.poolSize | quote }}
            - name: DATABASE_PATH
              value: {{ .Values.persistence.mountPath }}/phaeton.db
            {{- if .Values.env.dnsClusterQuery }}
            - name: DNS_CLUSTER_QUERY
              value: {{ .Values.env.dnsClusterQuery | quote }}
            {{- end }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "phaeton.secretName" . }}
                  key: {{ include "phaeton.secretKey" . }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "phaeton.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
